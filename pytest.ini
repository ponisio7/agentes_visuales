# pytest.ini
# Configuración central para pytest en el proyecto Agentes Visuales

[pytest]
# ============================================================
# OPCIONES DE EJECUCIÓN
# ============================================================
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    -p no:cacheprovider
    --color=yes

# ============================================================
# PATHS Y DESCUBRIMIENTO DE PRUEBAS
# ============================================================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================
# MARCADORES REGISTRADOS
# ============================================================
markers =
    slow: Pruebas que toman tiempo o requieren GUI
    quick: Pruebas rápidas que no requieren recursos externos
    unit: Pruebas unitarias (rápidas, aisladas)
    integration: Pruebas de integración entre componentes
    gui: Pruebas que requieren interfaz gráfica (QApplication)
    executor: Pruebas de ejecutores (Python, Shell, HTTP, LLM, etc.)
    scheduler: Pruebas del orquestador (Scheduler)
    database: Pruebas de base de datos SQLite
    config: Pruebas de configuración y persistencia
    sandbox: Pruebas del sandbox de Python
    loops: Pruebas específicas de agentes LOOP
    exporters: Pruebas de exportación de resultados
    network: Pruebas que requieren conexión a internet
    deepseek: Pruebas que requieren la API de DeepSeek
    http: Pruebas que realizan peticiones HTTP
    api: Pruebas que dependen de APIs externas
    wip: Work In Progress - pruebas en desarrollo
    skip_ci: Pruebas que se omiten en CI/CD
    flaky: Pruebas que fallan intermitentemente

# ============================================================
# FILTRO DE ADVERTENCIAS
# ============================================================
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*uncollectable.*:pytest.PytestWarning
    ignore:.*ResourceWarning.*:ResourceWarning
    # Un test que devuelve algo distinto de None NO comprueba nada: por
    # defecto pytest solo avisa y lo marca PASSED (fue el bug X1 de
    # test_ab_sintetico). Aquí se convierte en fallo.
    error::pytest.PytestReturnNotNoneWarning

# ============================================================
# LOGGING
# ============================================================
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = WARNING
log_file = logs/test_results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ============================================================
# OPCIONES DE COLECCIÓN
# ============================================================
norecursedirs =
    .git
    .pytest_cache
    .venv
    venv
    env
    __pycache__
    logs
    .idea
    .vscode
    coverage_report
    build
    dist
    *.egg

# ============================================================
# OPCIONES DE EJECUCIÓN DE PRUEBAS
# ============================================================
