# pytest.ini
# Configuración central para pytest en el proyecto Agentes Visuales

[pytest]

# ============================================================
# PATHS Y DESCUBRIMIENTO DE PRUEBAS
# ============================================================

# Directorio donde pytest buscará las pruebas
testpaths = tests

# Patrones para identificar archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============================================================
# OPCIONES DE EJECUCIÓN
# ============================================================

addopts =
    # Salida detallada
    -v
    # Strict mode: falla si hay marcadores no registrados
    --strict-markers
    # Traza de error corta para mejor legibilidad
    --tb=short
    # Detener después de 5 fallos
    --maxfail=5
    # Desactivar caché de pytest para evitar problemas con archivos .pyc
    -p no:cacheprovider
    # Colores en la salida
    --color=yes
    # Mostrar salida de print() en tiempo real (útil para debugging)
    -s

# ============================================================
# MARCADORES REGISTRADOS
# ============================================================

markers =
    # Marcadores de velocidad/requisitos
    slow: Pruebas que toman tiempo o requieren GUI
    quick: Pruebas rápidas que no requieren recursos externos
    
    # Marcadores de tipo de prueba
    unit: Pruebas unitarias (rápidas, aisladas)
    integration: Pruebas de integración entre componentes
    gui: Pruebas que requieren interfaz gráfica (QApplication)
    
    # Marcadores por componente
    executor: Pruebas de ejecutores (Python, Shell, HTTP, LLM, etc.)
    scheduler: Pruebas del orquestador (Scheduler)
    database: Pruebas de base de datos SQLite
    config: Pruebas de configuración y persistencia
    sandbox: Pruebas del sandbox de Python
    loops: Pruebas específicas de agentes LOOP
    exporters: Pruebas de exportación de resultados
    
    # Marcadores por requisitos externos
    network: Pruebas que requieren conexión a internet
    deepseek: Pruebas que requieren la API de DeepSeek
    http: Pruebas que realizan peticiones HTTP
    api: Pruebas que dependen de APIs externas
    
    # Marcadores de estado
    wip: Work In Progress - pruebas en desarrollo
    skip_ci: Pruebas que se omiten en CI/CD
    flaky: Pruebas que fallan intermitentemente

# ============================================================
# FILTRO DE ADVERTENCIAS
# ============================================================

filterwarnings =
    # Ignorar advertencias de deprecación de bibliotecas externas
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    
    # Ignorar advertencias de pytest sobre colección de clases sin tests
    ignore:.*uncollectable.*:pytest.PytestWarning
    
    # Ignorar advertencias de ResourceWarning en pruebas de archivos temporales
    ignore:.*ResourceWarning.*:ResourceWarning

# ============================================================
# LOGGING
# ============================================================

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Logging a archivo (para depuración en CI)
log_file = logs/test_results.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(filename)s:%(lineno)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ============================================================
# OPCIONES DE COLECCIÓN
# ============================================================

# No recopilar pruebas de estos directorios
norecursedirs =
    .git
    .pytest_cache
    .venv
    venv
    env
    __pycache__
    logs
    .idea
    .vscode

# ============================================================
# OPCIONES DE EJECUCIÓN DE PRUEBAS
# ============================================================

# Timeout global para pruebas (requiere pytest-timeout)
# timeout = 30
# timeout_method = thread

# ============================================================
# VARIABLES DE ENTORNO PARA PRUEBAS
# ============================================================

# Configuración de entorno para pruebas
env =
    AGENTES_VISUALES_TEST_MODE=1
    PYTHONUNBUFFERED=1
    PYTHONDONTWRITEBYTECODE=1

# ============================================================
# REPORTES (opcional, requiere plugins adicionales)
# ============================================================

# Reporte de cobertura (requiere pytest-cov)
# --cov=core
# --cov=storage
# --cov=ui
# --cov-report=html:coverage_report
# --cov-report=term
# --cov-fail-under=70

# Reporte de resultados en formato XML (para CI)
# --junitxml=logs/junit_results.xml

# ============================================================
# OPCIONES DE CONSOLA
# ============================================================

# Mostrar las pruebas más lentas
# --durations=5

# Mostrar el nombre completo de las pruebas
# --show-capture=no

# ============================================================
# NOTA SOBRE PLUGINS
# ============================================================

# Plugins recomendados:
# - pytest-timeout: Timeout para pruebas
# - pytest-cov: Cobertura de código
# - pytest-xdist: Ejecución paralela
# - pytest-html: Reporte HTML
# - pytest-env: Variables de entorno

# Instalación:
# pip install pytest-timeout pytest-cov pytest-xdist pytest-html pytest-env